<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS - Security Operations Center</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-halved text-primary fs-3"></i>
            <a href="{{ url_for('index') }}" class="sidebar-brand">NIDS <span class="text-gradient">SOC</span></a>
        </div>
        <ul class="sidebar-nav">
            <li>
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == '/' else '' }}">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="{{ url_for('live') }}" class="{{ 'active' if request.path == '/live' else '' }}">
                    <i class="fas fa-satellite-dish"></i> Live Monitor <span class="pulse-indicator ms-auto"></span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('alerts') }}" class="{{ 'active' if request.path == '/alerts' else '' }}">
                    <i class="fas fa-bell"></i> Alerts
                </a>
            </li>
            <li>
                <a href="{{ url_for('analytics') }}" class="{{ 'active' if request.path == '/analytics' else '' }}">
                    <i class="fas fa-chart-line"></i> Analytics
                </a>
            </li>
            <li>
                <a href="{{ url_for('history') }}" class="{{ 'active' if request.path == '/history' else '' }}">
                    <i class="fas fa-history"></i> Attack History
                </a>
            </li>
            <li>
                <a href="{{ url_for('reports') }}" class="{{ 'active' if request.path == '/reports' else '' }}">
                    <i class="fas fa-file-pdf"></i> Reports
                </a>
            </li>
            <li>
                <a href="{{ url_for('settings') }}" class="{{ 'active' if request.path == '/settings' else '' }}">
                    <i class="fas fa-gear"></i> Settings
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div>
                <h5 class="m-0 text-secondary fw-semibold">{% block page_title %}Dashboard{% endblock %}</h5>
            </div>
            <div class="d-flex align-items-center gap-4">
                <div class="d-flex align-items-center gap-2">
                    <span class="pulse-indicator"></span>
                    <span class="text-secondary small fw-bold">SYSTEM ACTIVE</span>
                </div>
                <button class="btn btn-link text-secondary p-0 border-0" id="theme-toggle">
                    <i class="fas fa-moon fs-5" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <!-- Content Wrapper -->
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
