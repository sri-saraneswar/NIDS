{% extends 'base.html' %}

{% block page_title %}Attack History{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="soc-card">
            <div class="soc-card-header d-flex justify-content-between align-items-center">
                <h6 class="soc-card-title m-0">Historical Attack Database</h6>
                <div>
                    <button class="btn btn-sm btn-outline-success me-2" onclick="$('.buttons-csv').click()"><i class="fas fa-file-csv"></i> CSV</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="$('.buttons-pdf').click()"><i class="fas fa-file-pdf"></i> PDF</button>
                </div>
            </div>
            
            <div class="table-responsive mt-3">
                <table id="historyTable" class="table table-soc table-hover w-100">
                    <thead>
                        <tr>
                            <th>Attack ID</th>
                            <th>Time</th>
                            <th>Severity</th>
                            <th>Type</th>
                            <th>Source IP</th>
                            <th>Target IP</th>
                            <th>Duration</th>
                            <th>Packets</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <!-- Populated by Data API on load, not live feed, to prevent re-rendering massive tables on every tick -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        const table = $('#historyTable').DataTable({
            pageLength: 25,
            order: [[1, 'desc']],
            responsive: true,
            ajax: {
                url: '/api/history',
                dataSrc: ''
            },
            columns: [
                { data: 'alert_id', render: data => data ? data.substring(0, 8) : '' },
                { data: 'start_time', render: data => parseBackendDate(data).toLocaleString() },
                { data: 'severity', render: data => getSeverityBadge(data) },
                { data: 'attack_type' },
                { data: 'source_ip' },
                { data: 'destination_ip', defaultContent: '' },
                { data: null, render: data => Math.max(1, Math.round((parseBackendDate(data.last_seen) - parseBackendDate(data.start_time)) / 1000)) + 's' },
                { data: 'packet_count' },
                { data: null, render: () => '<span class="badge bg-secondary text-light">RESOLVED</span>' }
            ],
            dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6 text-end"Bf>>rt<"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
            buttons: [
                {
                    extend: 'csv',
                    className: 'd-none',
                    title: 'NIDS_Attack_History'
                },
                {
                    extend: 'pdf',
                    className: 'd-none',
                    title: 'NIDS Attack History',
                    orientation: 'landscape',
                    pageSize: 'A4'
                }
            ]
        });
        
        // Auto refresh table every 10 seconds to keep history updated
        document.addEventListener('nids:sync', () => {
            setInterval(() => {
                table.ajax.reload(null, false);
            }, 10000);
        });
    });
</script>
{% endblock %}
